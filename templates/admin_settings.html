{% extends "admin_layout.html" %}
{% block title %}Site Settings - Admin{% endblock %}
{% block admin_content %}
<h2>Site Settings</h2>
<form method="POST" enctype="multipart/form-data" class="card">
  <div class="form-row">
    <div>
      <div class="label">Theme Color</div>
      <input class="input" type="color" name="theme_color" value="{{ settings.get('theme_color', '#ffc0cb') }}">
    </div>
    <div>
      <div class="label">Admin Profile (about)</div>
      <input class="input" type="text" name="admin_profile" value="{{ settings.get('admin_profile','') }}" placeholder="About the admin">
    </div>
  </div>
  <div class="form-row" style="margin-top:.6rem;">
    <div>
      <div class="label">Logo URL</div>
      <input class="input" type="text" name="logo_url" value="{{ settings.get('site_logo','') }}" placeholder="/static/images/logo.png">
    </div>
    <div>
      <div class="label">Or Upload Logo</div>
      <input class="input" type="file" name="logo_file" accept="image/*">
    </div>
  </div>
  <div style="margin-top:1rem;">
    <button class="btn primary" type="submit">Save Settings</button>
  </div>
</form>
{% endblock %}
