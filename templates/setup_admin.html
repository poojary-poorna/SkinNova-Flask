{% extends "base.html" %}

{% block title %}Setup Admin - SkinNova{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon"><i class="fas fa-key"></i></div>
      <h1>Setup Admin</h1>
      <p>Create the first administrator account</p>
    </div>
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label for="username" class="form-label"><i class="fas fa-user-shield"></i> Admin Username</label>
        <input type="text" id="username" name="username" class="input-modern" placeholder="e.g., Poorna002" required>
      </div>
      <div class="form-group">
        <label for="email" class="form-label"><i class="fas fa-envelope"></i> Email (optional)</label>
        <input type="email" id="email" name="email" class="input-modern" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label for="password" class="form-label"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="password" class="input-modern" placeholder="Choose a strong password" required>
      </div>
      <button type="submit" class="btn-modern btn-full"><i class="fas fa-check"></i> Create Admin</button>
    </form>
    <div class="auth-footer">
      <p>Already configured? <a href="{{ url_for('login_admin') }}">Go to Admin Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
