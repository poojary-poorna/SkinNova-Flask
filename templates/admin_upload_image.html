{% extends "base.html" %}

{% block title %}Upload Product Image{% endblock %}

{% block content %}
<div class="card" style="max-width:700px;margin:0 auto;">
  <div class="card-header">
    <h2><i class="fas fa-upload"></i> Upload Product Image</h2>
  </div>
  <div style="padding:1.5rem;">
    <form method="POST" enctype="multipart/form-data">
      <div class="form-group" style="margin-bottom:1rem;">
        <label for="sku">Product SKU</label>
        <input type="text" id="sku" name="sku" class="form-control" placeholder="e.g. LIP-0001" required />
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label for="image">Image file (JPG/PNG/WEBP/GIF)</label>
        <input type="file" id="image" name="image" accept="image/*" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-cloud-upload-alt"></i> Upload</button>
      <a href="{{ url_for('makeup_recommendations') }}" class="btn btn-secondary">Back to Recommendations</a>
    </form>
  </div>
</div>
{% endblock %}
