{% extends "base.html" %}

{% block title %}Login - SkinNova{% endblock %}

{% block extra_head %}
<style>
/* Pink Water Aesthetic Background for Login Page */
body {
    background: 
        linear-gradient(135deg, 
            rgba(255, 192, 203, 0.3) 0%,
            rgba(255, 182, 193, 0.4) 25%,
            rgba(255, 105, 180, 0.35) 50%,
            rgba(255, 182, 193, 0.4) 75%,
            rgba(255, 192, 203, 0.3) 100%
        ),
        url('https://i.pinimg.com/originals/6g/WZ/8Z/6gWZ8ZCoV.jpg') center center / cover no-repeat fixed;
    min-height: 100vh;
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.6) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(255, 105, 180, 0.5) 0%, transparent 60%),
        radial-gradient(circle at 40% 80%, rgba(255, 192, 203, 0.55) 0%, transparent 60%),
        radial-gradient(circle at 60% 20%, rgba(255, 182, 193, 0.45) 0%, transparent 60%);
    animation: waterFlow 20s ease-in-out infinite;
    z-index: -1;
}

@keyframes waterFlow {
    0%, 100% {
        transform: translateX(0) translateY(0) rotate(0deg) scale(1);
        filter: hue-rotate(0deg) brightness(1);
    }
    25% {
        transform: translateX(15px) translateY(-20px) rotate(1deg) scale(1.02);
        filter: hue-rotate(10deg) brightness(1.1);
    }
    50% {
        transform: translateX(-10px) translateY(15px) rotate(-0.5deg) scale(0.98);
        filter: hue-rotate(-5deg) brightness(0.95);
    }
    75% {
        transform: translateX(-15px) translateY(-5px) rotate(0.8deg) scale(1.01);
        filter: hue-rotate(8deg) brightness(1.05);
    }
}

/* Enhanced Login Form Styling */
.login-container {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
    border: 2px solid rgba(255, 182, 193, 0.5);
    position: relative;
    overflow: hidden;
}

.login-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, 
        transparent, 
        rgba(255, 182, 193, 0.3), 
        rgba(255, 105, 180, 0.2), 
        rgba(255, 182, 193, 0.3), 
        transparent
    );
    transition: left 0.8s ease;
    z-index: 1;
}

.login-container:hover::before {
    left: 100%;
}

.login-container > * {
    position: relative;
    z-index: 2;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-container animated-bg">
    <div class="auth-card glass card-hover animate-fade-in">
        <div class="auth-header">
            <div class="auth-icon floating">
                <i class="fas fa-sparkles"></i>
            </div>
            <h1 class="gradient-text">Welcome Back</h1>
            <p>Sign in to access your personalized beauty recommendations</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="username" class="form-label">
                    <i class="fas fa-user"></i> Username
                </label>
                <input type="text" id="username" name="username" class="input-modern" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" name="password" class="input-modern" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn-modern btn-full">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="gradient-text">Create one here</a></p>
        </div>
    </div>
</div>

<style>
.auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
    padding: 2rem 0;
    position: relative;
}

.auth-card {
    background: var(--bg-secondary);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 3rem;
    width: 100%;
    max-width: 450px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

[data-theme="dark"] .auth-card {
    background: rgba(10, 10, 15, 0.9);
    border: 1px solid rgba(0, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
}

.auth-header {
    text-align: center;
    margin-bottom: 2.5rem;
    position: relative;
}

.auth-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    color: var(--primary);
    text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
}

[data-theme="dark"] .auth-icon {
    text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
}

.auth-header h1 {
    font-size: 2.5rem;
    margin-bottom: 0.5rem;
    font-weight: 700;
}

.auth-header p {
    color: var(--text-secondary);
    margin-bottom: 0;
    font-size: 1.1rem;
    opacity: 0.9;
}

.auth-form {
    margin-bottom: 2rem;
}

.form-group {
    margin-bottom: 1.5rem;
    position: relative;
}

.form-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    font-weight: 600;
    color: var(--text-primary);
    font-size: 0.95rem;
}

[data-theme="dark"] .form-label {
    text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
}

.form-label i {
    color: var(--primary);
    width: 16px;
}

.input-modern {
    width: 100%;
    padding: 1rem 1.5rem;
    border: 2px solid var(--border-color);
    border-radius: 16px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background: var(--bg-secondary);
    color: var(--text-primary);
    backdrop-filter: blur(10px);
}

[data-theme="dark"] .input-modern {
    background: var(--input-bg);
    border-color: var(--input-border);
    color: var(--text-primary);
}

.input-modern:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.1);
    transform: translateY(-2px);
}

[data-theme="dark"] .input-modern:focus {
    border-color: var(--input-focus);
    box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.2);
}

.input-modern::placeholder {
    color: var(--text-muted);
    opacity: 0.8;
}

.btn-modern {
    width: 100%;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: none;
    border-radius: 16px;
    background: var(--gradient-primary);
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}

.btn-modern::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
}

.btn-modern:hover::before {
    left: 100%;
}

.btn-modern:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
}

[data-theme="dark"] .btn-modern {
    box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
}

[data-theme="dark"] .btn-modern:hover {
    box-shadow: 0 8px 30px rgba(0, 255, 255, 0.4);
}

.btn-modern i {
    margin-right: 0.5rem;
}

.auth-footer {
    text-align: center;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border-color);
}

[data-theme="dark"] .auth-footer {
    border-color: rgba(0, 255, 255, 0.2);
}

.auth-footer p {
    color: var(--text-secondary);
    margin-bottom: 0;
}

.auth-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s ease;
    position: relative;
}

.auth-footer a:hover {
    text-decoration: none;
    transform: translateY(-1px);
}

.auth-footer a::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--gradient-primary);
    transition: width 0.3s ease;
}

.auth-footer a:hover::after {
    width: 100%;
}

/* Floating particles background */
.auth-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(0,255,255,0.1)"/><circle cx="80" cy="40" r="1.5" fill="rgba(255,0,255,0.1)"/><circle cx="40" cy="80" r="1" fill="rgba(0,255,0,0.1)"/><circle cx="90" cy="90" r="1.5" fill="rgba(255,255,0,0.1)"/></svg>');
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
}

[data-theme="light"] .auth-container::before {
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,107,157,0.1)"/><circle cx="80" cy="40" r="1.5" fill="rgba(168,230,207,0.1)"/><circle cx="40" cy="80" r="1" fill="rgba(136,216,192,0.1)"/><circle cx="90" cy="90" r="1.5" fill="rgba(255,179,186,0.1)"/></svg>');
}

@media (max-width: 480px) {
    .auth-card {
        padding: 2rem 1.5rem;
        margin: 0 1rem;
        border-radius: 20px;
    }
    
    .auth-header h1 {
        font-size: 2rem;
    }
    
    .auth-icon {
        font-size: 2.5rem;
    }
}

/* Loading state */
.btn-modern:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none;
}

.btn-modern:disabled:hover {
    transform: none;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
</style>
{% endblock %}
